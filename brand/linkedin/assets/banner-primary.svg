<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Lars J. Frank — The Sense of Nonsense">
  <!--
    LinkedIn 1584×396.
    Avatar overlaps bottom-left (~300×300 circle). Keep type right of x≈440.
  -->
  <rect width="1584" height="396" fill="#FFFFFF"/>
  <rect x="0" y="0" width="18" height="396" fill="#DE0000"/>
  <rect x="18" y="0" width="1" height="396" fill="#D6D4D1"/>

  <!-- Quiet field under avatar; no type here -->
  <g opacity="0.22" stroke="#D6D4D1" stroke-width="1">
    <line x1="48" y1="220" x2="380" y2="220"/>
    <line x1="48" y1="256" x2="340" y2="256"/>
    <line x1="48" y1="292" x2="300" y2="292"/>
    <line x1="48" y1="328" x2="260" y2="328"/>
  </g>

  <text x="460" y="148"
        font-family="Source Serif 4, Georgia, 'Times New Roman', serif"
        font-size="58"
        font-weight="600"
        fill="#3C3D3C">Lars J. Frank</text>

  <text x="460" y="198"
        font-family="Libre Franklin, Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="500"
        fill="#525252"
        letter-spacing="1.5">THE SENSE OF NONSENSE</text>

  <line x1="460" y1="228" x2="700" y2="228" stroke="#DE0000" stroke-width="2"/>

  <text x="460" y="272"
        font-family="Source Serif 4, Georgia, 'Times New Roman', serif"
        font-size="24"
        font-style="italic"
        fill="#8B8783">Stories and analysis from within the nonsense</text>

  <g opacity="0.35" stroke="#D6D4D1" stroke-width="1">
    <line x1="1180" y1="90" x2="1512" y2="90"/>
    <line x1="1180" y1="126" x2="1512" y2="126"/>
    <line x1="1180" y1="162" x2="1512" y2="162"/>
    <line x1="1180" y1="198" x2="1512" y2="198"/>
    <line x1="1180" y1="234" x2="1512" y2="234"/>
    <line x1="1180" y1="270" x2="1512" y2="270"/>
    <line x1="1180" y1="306" x2="1440" y2="306"/>
  </g>
  <rect x="1180" y="90" width="8" height="216" fill="#DE0000" opacity="0.85"/>
</svg>
