backend:
  name: github
  repo: lars-j-frank/thesenseofnonsense
  branch: main
  base_url: https://thesenseofnonsense.com
  auth_endpoint: api/auth

publish_mode: editorial_workflow
media_folder: static/images
public_folder: /images

collections:
  - name: tier-files
    label: The TIER Files
    label_singular: Article
    folder: content/series/the-tier-files
    create: true
    slug: "{{slug}}"
    format: yaml-frontmatter
    filter:
      field: series
      value: The TIER Files
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Summary, name: summary, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Series, name: series, widget: string, default: "The TIER Files" }
      - { label: Part, name: part, widget: number, value_type: int, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: Tags, name: tags, widget: list, required: false }

  - name: essays
    label: Essays
    label_singular: Essay
    folder: content/essays
    create: true
    slug: "{{slug}}"
    format: yaml-frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Publish Date, name: date, widget: datetime }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: Topics, name: topics, widget: list, required: false }
