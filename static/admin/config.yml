backend:
  name: github
  repo: lars-j-frank/thesenseofnonsense
  branch: main
  base_url: https://thesenseofnonsense.com
  auth_endpoint: api/auth
  commit_messages:
    create: 'content({{collection}}): create {{slug}}'
    update: 'content({{collection}}): update {{slug}}'
    delete: 'content({{collection}}): delete {{slug}}'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'
    openAuthoring: 'content({{collection}}): {{message}}'

# Drafts autosave to a GitHub branch/PR; Publish merges to main and Cloudflare deploys.
publish_mode: editorial_workflow

site_url: https://thesenseofnonsense.com
display_url: https://thesenseofnonsense.com

media_folder: static/images
public_folder: /images

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # --- Series articles (Hugo leaf bundles: slug/index.md + images) ---
  - name: tier-files
    label: The TIER Files
    label_singular: Article
    folder: content/series/the-tier-files
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    sortable_fields: ["commit_date", "date", "title", "part"]
    summary: "Part {{part}}: {{title}}"
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Published, field: draft, pattern: false }
    view_groups:
      - { label: Year, field: date, pattern: \d{4} }
    preview_path: "series/the-tier-files/{{slug}}/"
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: "Folder and URL segment, e.g. part-2-the-next-chapter. Set this before first publish."
      - { label: Description, name: description, widget: text, hint: "Short dek / social description", required: false }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Body, name: body, widget: markdown, hint: "Images upload into this article folder. Prefer ![alt](file.png) or Hugo figure shortcodes with the filename only." }
      - { label: Publish Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: HH:mm }
      - { label: Draft, name: draft, widget: boolean, default: true, hint: "Keep true until ready for the live site (Hugo skips drafts)." }
      - { label: Series, name: series, widget: string, default: "The TIER Files", hint: "Must match the series landing page title exactly." }
      - { label: Part number, name: part, widget: number, value_type: int, min: 1, required: false }
      - { label: Featured on homepage, name: featured, widget: boolean, default: false, required: false }
      - { label: Author, name: author, widget: string, default: "Lars J. Frank", required: false }
      - label: Topics
        name: topics
        widget: list
        required: false
        hint: "Taxonomy topics shown on the article (e.g. Alberta, TIER). Plain strings, one per item."
      - label: Cover image filenames
        name: images
        widget: list
        required: false
        hint: "Optional filenames already in this article folder (e.g. tier-fund-flow.png)."

  # --- Standalone essays (also leaf bundles for easy images) ---
  - name: essays
    label: Essays
    label_singular: Essay
    folder: content/essays
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    sortable_fields: ["commit_date", "date", "title"]
    summary: "{{title}}"
    preview_path: "essays/{{slug}}/"
    editor:
      preview: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, hint: "URL segment under /essays/", required: false }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Publish Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: HH:mm }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Featured on homepage, name: featured, widget: boolean, default: false, required: false }
      - { label: Author, name: author, widget: string, default: "Lars J. Frank", required: false }
      - label: Topics
        name: topics
        widget: list
        required: false

  # --- Fixed pages and series landings ---
  - name: pages
    label: Pages
    files:
      - name: about
        label: About
        file: content/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Date, name: date, widget: datetime }
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Type, name: type, widget: hidden, default: about }
          - { label: Body, name: body, widget: markdown }

      - name: tier-files-landing
        label: "Series landing — The TIER Files"
        file: content/series/the-tier-files/_index.md
        fields:
          - { label: Title, name: title, widget: string, hint: "Article series field must match this title exactly." }
          - { label: Date, name: date, widget: datetime }
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Type, name: type, widget: hidden, default: series-landing }
          - { label: Summary, name: summary, widget: text, required: false }
          - { label: Body, name: body, widget: markdown }

      - name: essays-landing
        label: "Essays section intro"
        file: content/essays/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Date, name: date, widget: datetime }
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Body, name: body, widget: markdown, required: false }

      - name: series-index
        label: "Series section intro"
        file: content/series/_index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Date, name: date, widget: datetime }
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Body, name: body, widget: markdown, required: false }
