backend:
  name: github
  repo: lars-j-frank/thesenseofnonsense
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: editorial_workflow
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "series"
    label: "Series Articles"
    label_singular: "Article"
    folder: "content/series"
    create: true
    path: "{{slug}}/index"
    identifier_field: title
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    preview_path: "series/{{dirname}}/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Author", name: "author", widget: "hidden", default: "Lars J. Frank" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Series", name: "series", widget: "string" }
      - { label: "Part", name: "part", widget: "number", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" }, required: false }
      - { label: "Topics", name: "topics", widget: "list", field: { label: "Topic", name: "topic", widget: "string" }, required: false }
      - { label: "Images (social card)", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" }, required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "essays"
    label: "Essays"
    folder: "content/essays"
    create: true
    path: "{{slug}}/index"
    identifier_field: title
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Author", name: "author", widget: "hidden", default: "Lars J. Frank" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" }, required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "content"
    create: false
    identifier_field: title
    format: "yaml-frontmatter"
    files:
      - label: "About Page"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Archive Page"
        name: "archive"
        file: "content/archive.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
          - { label: "Body", name: "body", widget: "markdown" }