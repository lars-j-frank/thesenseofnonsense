{{ define "main" }}
<div class="page list-page">
  <header class="page-header">
    <h1>{{ .Title | default "Essays" }}</h1>
  </header>
  {{ with .Content }}
  <div class="prose section-intro">{{ . }}</div>
  {{ end }}
  <div class="card-grid">
    {{ $pages := .Pages.ByDate.Reverse }}
    {{ range $pages }}
    {{ partial "article-card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
