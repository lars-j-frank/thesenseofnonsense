{{ define "main" }}
<div class="page archive-page">
  <header class="page-header">
    <h1>{{ .Title | default "Archive" }}</h1>
  </header>
  {{ $pages := where .Site.RegularPages "Section" "in" (slice "series" "essays") }}
  {{ $pages = where $pages "Kind" "eq" "page" }}
  {{ $pages = $pages.ByDate.Reverse }}
  <div class="card-grid">
    {{ range $pages }}
    {{ partial "article-card.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
